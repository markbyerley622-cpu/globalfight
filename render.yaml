# ── Render blueprint ───────────────────────────────────────────────────────
# Render does NOT read vercel.json, so the cron schedules are defined here as
# Cron Job services that call the /api/cron/* routes with the shared secret.
#
# Setup:
#   1. Render → New → Blueprint → point at this repo.
#   2. Fill the `sync: false` secrets in the "globalfight" env group
#      (DATABASE_URL is wired automatically from the Postgres instance below).
#
#
# The schema is applied by the web service's buildCommand (`prisma db push`) on
# every deploy — this repo has no Prisma migrations, so nothing else creates the
# tables. This used to be a manual "run it once in the Render Shell" step, and
# the first deploy shipped without it: with no tables, every page rendered its
# empty state ("No upcoming") instead of erroring, because the queries swallow
# the failure — the site looked dataless rather than tableless. Keep it in the
# build.
#
# Cadences are grouped to keep the service count (and cost) down; they mirror
# vercel.json. Each job is a plain curl, so a failure just retries next tick.

databases:
  - name: globalfight-db
    databaseName: globalfight
    # Legacy plans ('starter') are rejected for new databases. Current tiers:
    # free (expires after 30 days), basic-256mb, basic-1gb, basic-4gb, pro-*.
    # The whole dataset (fighters/events/fights/articles) is well under 256MB.
    plan: basic-256mb

envVarGroups:
  - name: globalfight
    envVars:
      - key: NODE_ENV
        value: production
      # Shared cron secret — cron-handler.ts accepts SCRAPE_CRON_SECRET or CRON_SECRET.
      - key: CRON_SECRET
        generateValue: true
      # Host the cron jobs curl. Set EXPLICITLY here rather than via
      # `fromService property: host` on each cron service — that indirection was
      # resolving to the bare service name ("globalfight") instead of the
      # resolvable hostname, so every job failed with
      #   curl: (7) Failed to connect to globalfight port 443
      # A literal value is defined once, shared by every cron, and can't drift.
      # If Render assigns a different origin, change it here (host only, no scheme).
      - key: APP_HOST
        value: globalfight.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      # THE ingestion gate — as of 2026-08-01 the only one. The per-source legal
      # allow-list in src/lib/ingestion-registry.ts was removed on the operator's
      # instruction; isSourceEnabled() now returns true for every id, so this
      # switch alone decides whether anything reaches the network.
      #
      # This was "false", and that is why bout RESULTS never updated in
      # production. The hourly gf-cron-results job fired on schedule, called
      # /api/cron/refresh-results, and the Wikipedia harvest threw
      # "Scraper disabled: ENABLE_SCRAPER is \"false\"" on its first fetch —
      # Wikipedia is the ONLY source carrying bout winners/method, and it reaches
      # the network through the same gated fetchPage() as every scraper. Every
      # completed card therefore sat on "Result pending" forever while the cron
      # dashboard showed green (see cron-handler.ts for that half of the bug).
      #
      # `true` here now unlocks every provider that is WIRED INTO THE RUNNER —
      # wikipedia-facts (CC BY-SA text, bout results), BKFC, ONE, ADCC — with no
      # per-source check behind it. Sources with no provider code (ufcstats,
      # promotion rankings, federations) still do not run, but only because
      # nothing calls them, not because anything refuses. Setting this to "false"
      # is the one way to stop all ingestion. MEDIA_INGESTION_ENABLED remains a
      # separate switch: no image is re-hosted from Wikimedia by turning this on.
      - key: ENABLE_SCRAPER
        value: "true"
      # 800ms was too fast for onefc.com: a single ONE refresh drew 199 HTTP 429
      # refusals out of 224 event pages. The client honours each refusal and does
      # not retry, so those events simply came back with no poster and no card —
      # the throttle was silently costing coverage, not just speed.
      #
      # 3000ms is the rate at which that run stops being refused. It makes a full
      # ONE pass slower, which is the correct trade: an unthrottled pass that gets
      # 429'd returns nothing.
      - key: SCRAPER_RATE_LIMIT_MS
        value: "3000"
      - key: SCRAPER_MAX_RETRIES
        value: "2"
      - key: BKFC_CONCURRENCY
        value: "3"
      - key: BKFC_MAX_PAGES
        value: "0"
      - key: ONE_CONCURRENCY
        value: "3"
      - key: ONE_MAX_PAGES
        value: "0"
      - key: WIKICARD_BATCH
        value: "40"
      # Pending-result events per hourly `refresh-results` run — small on purpose.
      - key: RESULT_BATCH
        value: "12"
      - key: WIKICARD_CONCURRENCY
        value: "2"
      - key: MEDIA_INGESTION_ENABLED
        value: "true"
      # Own-profile avatar / banner uploads. NOT the same switch as
      # UGC_MEDIA_UPLOADS_ENABLED (clips + forum attachments), which stays off until
      # there is a moderation queue.
      #
      # This route re-encodes every upload through sharp, so the stored object is
      # generated by us and the uploaded bytes are never served — there is no
      # unscanned file to publish. With only the blanket flag, "upload a profile
      # picture" answered 503 for every user, which is why nobody could set one.
      # See src/lib/feature-flags.ts for the full risk comparison.
      - key: PROFILE_IMAGE_UPLOADS_ENABLED
        value: "true"
      # ── Transactional email — REQUIRED for password reset ────────────────
      # With these unset, /api/auth/password/reset/request answers 503
      # "Password reset is temporarily unavailable" by design: it refuses to mint a
      # reset token nobody can receive, rather than saying "check your inbox" for
      # mail that was never sent. That honesty is correct, but it means PASSWORD
      # RESET IS DEAD until these three are filled in.
      #
      # Set all three in the Render dashboard (Resend: resend.com → API Keys):
      #   EMAIL_PROVIDER=resend
      #   RESEND_API_KEY=re_…
      #   EMAIL_FROM=no-reply@<a domain you have verified with Resend>
      #
      # EMAIL_FROM must be on a domain verified in Resend, or every send 4xxs and the
      # reset silently fails for a different reason. Swapping providers means one new
      # branch in src/lib/email/send.ts and nothing else.
      #
      # ── NOT LAUNCH-READY IF EMAIL_FROM IS onboarding@resend.dev ──────────
      # That is Resend's SANDBOX sender. It needs no domain and no DNS, and it is
      # the right way to prove this wiring works end to end — but it can only
      # deliver to the address the Resend account was registered with. Every other
      # recipient is rejected by Resend, and the app cannot tell: the reset route
      # returns the same "if that email is registered, we've sent a reset link" for
      # every outcome (deliberately — it must not leak who has an account). So a
      # sandbox sender in production looks EXACTLY like working password reset while
      # locking out every real user.
      #
      # A free-mail domain can never be used here either: outlook.com, gmail.com and
      # the like cannot be DNS-verified by you, and their DMARC policy exists
      # specifically to stop third parties sending as their users.
      #
      # LAUNCH CHECKLIST: EMAIL_FROM must be on a domain you own and have verified in
      # Resend. Confirm a reset email reaches an address that is NOT the Resend
      # account owner's before calling this done.
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ENRICH_BATCH
        value: "30"
      - key: LOG_LEVEL
        value: info
      # ── Fill these in the Render dashboard (never commit real values) ──────
      - key: ODDS_API_KEY
        sync: false
      - key: API_SPORTS_KEY
        sync: false
      # Image storage — required for fighter photos in production (public/headshots
      # is gitignored, so local files do not deploy). See scripts/photos-upload.mts.
      #
      # ALSO REQUIRED FOR USER UPLOADS (avatar / banner / gym photos).
      # images/store.ts resolves a backend in order: Vercel Blob → R2 → LOCAL DISK.
      # With none configured it silently succeeds onto the container's filesystem,
      # which on Render is EPHEMERAL — the upload works, the user sees their new
      # picture, and it disappears at the next deploy or restart. That failure mode is
      # worse than a refusal, because it looks like it worked. Fill these in before
      # telling anyone profile pictures are live.
      - key: STORAGE_PROVIDER
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

services:
  # ── Web app ──────────────────────────────────────────────────────────────
  - type: web
    name: globalfight
    runtime: node
    plan: starter
    # --include=dev is REQUIRED: NODE_ENV=production (set in the env group) makes
    # `npm ci` skip devDependencies, and the build needs @tailwindcss/postcss,
    # tailwindcss, typescript and prisma from there.
    #
    # `db push` runs WITH --accept-data-loss. Prisma flags *adding a unique
    # constraint* (ForumThread.eventId, Notification[userId,dedupeKey], …) as
    # possible data loss and aborts without the flag — even though those columns
    # are new/empty and nothing is dropped — which blocked a deploy. The flag
    # silences that false alarm. --skip-generate because the postinstall hook
    # already ran `prisma generate`.
    #
    # TRADE-OFF (owner-approved): this removes the automatic guard against a
    # schema change that would drop a POPULATED column. That safety is now a
    # code-review responsibility — inspect every schema diff for real column
    # drops/renames before merging, or migrate to Prisma Migrations (which apply
    # additive uniques cleanly) to restore the automatic guard.
    buildCommand: npm ci --include=dev && npx prisma db push --skip-generate --accept-data-loss && npm run build
    # boot.mts runs first, driven by the ALLOW_SEED_WORLD master switch. When it
    # is "true" the deployment is seeded ONCE if it has no seed users (idempotent).
    # When it is anything else, boot PURGES every trace of demo data from this
    # database — flipping the switch off is what turns a demo deployment into a
    # real one. It is NON-FATAL (`;`, not `&&`) so a seeding issue never stops the
    # app from starting, and it is safe to run on every restart.
    startCommand: node --import tsx prisma/seed/boot.mts ; npm start
    healthCheckPath: /
    envVars:
      - fromGroup: globalfight
      - key: DATABASE_URL
        fromDatabase:
          name: globalfight-db
          property: connectionString
      # Seed World — the MASTER switch. "true" allows simulated people to exist in
      # this database (and shows the transparent Demo World badge). ANY other value,
      # including unset, means demo data is PURGED at every boot — that is how a
      # demo deployment becomes a real one. Kept sync:false so the blueprint never
      # overwrites your dashboard choice.
      #
      # LAUNCH CHECKLIST: set ALLOW_SEED_WORLD to false (or delete it) and redeploy.
      # The next boot deletes every @seed.local account and everything it owns.
      - key: ALLOW_SEED_WORLD
        sync: false
      # Optional refinement, only read when ALLOW_SEED_WORLD=true:
      #   demo (default) → seed once if empty · refresh → rebuild once per deploy.
      # It cannot enable seeding on its own.
      - key: SEED_WORLD_MODE
        sync: false
      # Bearer token for POST /api/admin/seed-world/reset (removes all seed data).
      - key: SEED_WORLD_ADMIN_TOKEN
        generateValue: true
      # Must be a FULL origin (scheme included) — it's the base for password-reset
      # links and site metadata. `fromService property: host` yields a bare
      # hostname with no scheme, which produces broken links, so set it by hand
      # after the first deploy, to the real origin Render assigns the service
      # (Dashboard → globalfight → the URL under the service name). It looks like
      # https://globalfight.onrender.com — paste THAT, not this sentence. A
      # literal placeholder here is not a URL and config.ts will discard it.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

  # ── Cron: news + coverage (every 6h) ─────────────────────────────────────
  - type: cron
    name: gf-cron-news
    runtime: node
    plan: starter
    schedule: "0 */6 * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -m 600 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/refresh-news"
    envVars:
      - fromGroup: globalfight

  # ── Cron: events, odds, sync (daily) ─────────────────────────────────────
  - type: cron
    name: gf-cron-daily
    runtime: node
    plan: starter
    schedule: "0 4 * * *"
    buildCommand: "true"
    startCommand: >-
      for p in refresh-events sync refresh-odds refresh-p4p; do
        curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/$p" || true;
      done
    envVars:
      - fromGroup: globalfight

  # ── Cron: results + pick resolution (HOURLY) ─────────────────────────────
  # The reward step of the habit loop — "you called it, card earned" — only fires
  # once a bout's result is ingested AND picks are graded. Running this daily meant
  # a Sunday-afternoon card's reward could wait ~a day, long after the dopamine
  # window. This run ingests results then grades picks together, so the payoff
  # lands within the hour of the final bell.
  #
  # `refresh-results` was a NO-OP until the results backfill landed (see
  # runner.ts, case "results"), which is why completed cards sat on "Result
  # pending" indefinitely no matter how often this fired. It is now a real job:
  # RESULT_BATCH (12) recently-finished events per run, two Wikipedia requests
  # each — ~24 requests an hour, polite by any measure. resolve-picks only touches
  # decided, ungraded bouts, so it scans 0 rows when nothing new has finished.
  #
  # THREE CADENCES, ONE ROUTE (`?tier=`). The hourly job must not scan history:
  # an event that ended three years ago cannot acquire a result between 09:00 and
  # 10:00, so paying for it every hour buys nothing, while a card that ended last
  # night can and does. See RESULT_TIERS in wikicard/targets.ts.
  #
  #   recent — 7 days, hourly. The one that keeps "Result pending" short.
  #   daily  — 90 days, once a day. Catches whatever the hourly tier missed while
  #            a source was down or an article had not been written yet.
  #   deep   — unbounded, weekly. Historical reconciliation.
  #
  # Completed cards and one-shot imports are excluded from all three by the query
  # itself (Event.resultsCompleteAt + lib/scraper/source-policy), so these windows
  # bound the work rather than being the only thing that does.
  - type: cron
    name: gf-cron-results
    runtime: node
    plan: starter
    schedule: "20 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/refresh-results?tier=recent" || true;
      curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/resolve-picks" || true
    envVars:
      - fromGroup: globalfight

  # ── Cron: fighter images ────────────────────────────────────────────────
  # Three modes on one route, matched to how the data actually behaves:
  #
  #   new        daily — fill in fighters who have no image yet.
  #   revalidate weekly — conditional GET over images we already hold. Measured
  #              against ESPN: 15/15 answered 304 and 0.00 MB transferred, so a
  #              full pass costs requests and no bandwidth.
  #   retry      monthly — fighters a provider 404'd, past the 30-day backoff. A
  #              permanent miss must never be re-asked daily.
  #
  # Each fighter is persisted the instant its outcome is known, so a tick that
  # runs out of maxDuration keeps everything it already did.
  - type: cron
    name: gf-cron-images
    runtime: node
    plan: starter
    schedule: "10 3 * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/refresh-images?mode=new" || true
    envVars:
      - fromGroup: globalfight

  - type: cron
    name: gf-cron-images-revalidate
    runtime: node
    plan: starter
    schedule: "30 4 * * 0"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/refresh-images?mode=revalidate" || true
    envVars:
      - fromGroup: globalfight

  - type: cron
    name: gf-cron-images-retry
    runtime: node
    plan: starter
    schedule: "0 5 1 * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/refresh-images?mode=retry" || true
    envVars:
      - fromGroup: globalfight

  # ── Cron: results sweep, 90 days (daily) ────────────────────────────────
  # The safety net under the hourly tier. Same route, wider window.
  - type: cron
    name: gf-cron-results-daily
    runtime: node
    plan: starter
    schedule: "40 5 * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/refresh-results?tier=daily" || true
    envVars:
      - fromGroup: globalfight

  # ── Cron: historical reconciliation (weekly) ────────────────────────────
  # Unbounded look-back. Rare on purpose: this is the only tier that can reach a
  # card older than 90 days, and nothing else should be paying for that reach.
  - type: cron
    name: gf-cron-results-deep
    runtime: node
    plan: starter
    schedule: "0 7 * * 0"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/refresh-results?tier=deep" || true
    envVars:
      - fromGroup: globalfight

  # ── Cron: promotion scrapers + Wikipedia cards (Mon & Thu) ───────────────
  - type: cron
    name: gf-cron-promotions
    runtime: node
    plan: starter
    schedule: "0 6 * * 1,4"
    buildCommand: "true"
    startCommand: >-
      for p in refresh-bkfc refresh-one refresh-wikicards; do
        curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/$p" || true;
      done
    envVars:
      - fromGroup: globalfight

  # ── Cron: BJJ (weekly) ───────────────────────────────────────────────────
  - type: cron
    name: gf-cron-weekly
    runtime: node
    plan: starter
    schedule: "0 8 * * 1"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/refresh-adcc" || true
    envVars:
      - fromGroup: globalfight

  # ── Cron: fighter photo + bio enrichment (HOURLY) ────────────────────────
  # Split out of gf-cron-weekly. refresh-enrich drains a bounded ENRICH_BATCH
  # (30) per run and is designed — per its own route comment — to run hourly so
  # the backlog clears and every fighter is rechecked within ENRICH_STALE_DAYS.
  # Weekly contradicted that: 30/week against 230 fighters is ~8 weeks before a
  # new roster has photos, and a fighter added today waits a week for a face.
  # That reads as "fighter images are broken" during exactly the window when
  # anyone is looking. Once drained an hourly run scans 0 rows (the query only
  # takes lastProfileScrapedAt null-or-stale), so this is cheap — and it stays
  # correct if ENABLE_SCRAPER is ever turned on and the roster jumps.
  # Hourly: fighter enrichment, the return engine, and the trusted-channel video
  # ingest. ingest-feed was MISSING from every cron service, which is why
  # /clips rendered its empty state in production while working locally — the
  # catalog is only ever populated by this route. Hourly matches what the
  # YouTube RSS endpoints advertise (Cache-Control: max-age=900).
  - type: cron
    name: gf-cron-enrich
    runtime: node
    plan: starter
    schedule: "0 * * * *"
    buildCommand: "true"
    startCommand: >-
      for p in refresh-enrich return-engine ingest-feed; do
        curl -fsS -m 900 --retry 3 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" "https://$APP_HOST/api/cron/$p" || true;
      done
    envVars:
      - fromGroup: globalfight
