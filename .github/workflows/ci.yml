name: CI

# Gate every push to main and every PR on the checks that already exist locally
# (typecheck, lint, test) plus a full production build. Before this, a green
# LOCAL run was the only thing between a commit and a live Render auto-deploy.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          # `gf_test`, not `gftest`. resetDb (test/integration/helpers) refuses to
          # TRUNCATE any database whose name does not match /(^|_)test$/ — a
          # deliberate rail, because the cost of that check being wrong is the
          # whole dataset, and an ambient DATABASE_URL can override an env file.
          # `gftest` does not match, so every integration test aborted in its
          # before-hook with "NOTHING WAS DELETED".
          #
          # The service has been misnamed since it was added and nobody could
          # know: `Test` fails first (see node-version above), so the integration
          # step had never once executed.
          POSTGRES_DB: gf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20. `npm test` is
          #     node --test "src/**/__tests__/**/*.test.ts"
          # and GLOB PATTERNS FOR `--test` DID NOT EXIST BEFORE NODE 21. On 20
          # the quoted pattern reached the runner as a literal path, so every
          # run died instantly with
          #     Could not find '.../src/**/__tests__/**/*.test.ts'
          # and exit 1 — before a single test executed.
          #
          # This is why main has been red for twelve consecutive runs while the
          # same command passes locally (Node 25, which expands it). It was NOT
          # a failing test, and the cost was much larger than the unit suite:
          # `Test` is the fourth step, so integration, the query-ownership
          # audit, the production build, Playwright and the axe pass were all
          # SKIPPED on every push. The workflow's own comment says it exists so
          # a green local run is not the only thing between a commit and a live
          # Render auto-deploy — and it has been enforcing typecheck and lint
          # only.
          #
          # Keep this at or above 21. Below it, the failure is silent in the
          # sense that matters: it looks like a test failure.
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`; keep an explicit call so a change to
      # the install flow can never leave the client ungenerated before typecheck.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Integration tests
        # `db push`, not `migrate deploy` — because that is how the schema
        # reaches PRODUCTION. CLAUDE.md is explicit: this repo keeps no migration
        # history and the Render build runs `prisma db push`. `prisma/migrations`
        # holds exactly one `0_init` snapshot, which nothing has updated since,
        # so `migrate deploy` built the test database from a schema frozen at
        # that commit. The first test to touch a column added later died with
        #     The column `dayStreak` does not exist in the current database
        # and it would have kept drifting further from schema.prisma with every
        # model change.
        #
        # Pushing the schema means the integration database is BY CONSTRUCTION
        # the schema the app is compiled against, and it exercises the same
        # mechanism the deploy uses. `--accept-data-loss` is safe and necessary
        # here for the same reason it is in render.yaml: Prisma treats adding a
        # unique constraint as possible data loss and refuses without it. The
        # database is created empty seconds earlier by the service container.
        run: |
          npx prisma db push --skip-generate --accept-data-loss
          npm run test:integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gf_test
          AUTH_SECRET: "7b3e91d6a52c08f4ae17c3b95d2f8016c4a7e3d91b6f52807ac4e1f39d8b62a5"

      # The query-ownership auditor. CLAUDE.md requires this to stay at 0 HIGH,
      # and it was the one documented gate that CI did not actually enforce —
      # a HIGH finding could reach main with a green tick.
      - name: Security audit (query ownership)
        run: npm run security:audit

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build's module graph resolves. No real database
          # is contacted: pages are force-dynamic and their request-time reads
          # fall back via the live() cold-start wrapper during static generation.
          #
          # AUTH_SECRET here and above was sixty-four ZEROES, and lib/auth-secret
          # refuses any value with fewer than 8 distinct characters — a real rail
          # against someone pasting a placeholder into production. So page-data
          # collection threw AuthSecretError on the first admin route it touched
          # and the build failed. A dummy still has to satisfy the app's own
          # startup guard; this one is high-entropy, and it is a throwaway CI
          # literal, not a secret (the E2E step below already has one in-repo).
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: "7b3e91d6a52c08f4ae17c3b95d2f8016c4a7e3d91b6f52807ac4e1f39d8b62a5"
          NEXT_PUBLIC_SITE_URL: https://ci.invalid

      # ── BROWSER SUITE ──────────────────────────────────────────────────────
      # Added because the Playwright suite had been UNRUNNABLE for an unknown
      # number of commits: global-setup stopped sending the consent field the
      # signup API began requiring, so every run died in setup. Nothing noticed,
      # because CI never ran it. A suite that is not in CI is a suite that is
      # not protecting anything.
      #
      # `--project=chromium` on PRs keeps the gate fast; the cross-browser
      # projects are tagged @xbrowser and run on main.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npx next start -p 3000 &
          # Poll the health endpoint rather than adding a wait-on dependency —
          # and poll THAT rather than "/" so the server is only considered ready
          # once the database is actually reachable.
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 90s"; exit 1
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gf_test
          AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET || '3f7a1c9e2b5d8046af13e7c95d2b8016f4a7c3e91d6b52807ac4f1e39d8b62c5' }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          EVIDENCE_R2_ENDPOINT: https://example.invalid
          EVIDENCE_R2_BUCKET: ci
          EVIDENCE_R2_ACCESS_KEY_ID: ci
          EVIDENCE_R2_SECRET_ACCESS_KEY: ci

      # Deterministic content, so a test asserting "an event card exists" is
      # testing the CARD and not the state of whatever database it found.
      - name: Seed the E2E world
        run: npm run seed:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gf_test

      - name: Accessibility (axe, WCAG 2.1 A/AA)
        run: npx playwright test test/e2e/06-accessibility.spec.ts --project=chromium
        env:
          BASE_URL: http://127.0.0.1:3000

      - name: End-to-end
        run: npx playwright test --project=chromium
        env:
          BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
